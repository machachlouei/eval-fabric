[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "eval-fabric"
version = "0.1.0"
description = "A pluggable evaluation orchestration framework for LLM and agentic systems."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "eval-fabric maintainers" }]
keywords = ["llm", "evaluation", "eval", "judge", "anyio"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.6",
    "anyio>=4.2",
    "click>=8.1",
    "pyyaml>=6.0",
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "tenacity>=8.2",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
parquet = ["pyarrow>=14", "s3fs>=2024.3"]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.30"]
dev = [
    "pytest>=8.0",
    "pytest-anyio>=0.0.0; python_version<'0'",
    "anyio[test]>=4.2",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest-cov>=5.0",
]

[project.urls]
Homepage = "https://github.com/machachlouei/eval-fabric"
Documentation = "https://github.com/machachlouei/eval-fabric/tree/main/docs"
Issues = "https://github.com/machachlouei/eval-fabric/issues"

[project.scripts]
ef = "eval_fabric.cli:main"

[project.entry-points."eval_fabric.evaluators"]
"eval_fabric.examples.echo" = "eval_fabric.evaluators.contrib.echo:echo"

[project.entry-points."eval_fabric.judges"]
"eval_fabric.exact_match" = "eval_fabric.judges.builtin:exact_match_judge"
"eval_fabric.regex" = "eval_fabric.judges.builtin:regex_judge"
"eval_fabric.json_schema" = "eval_fabric.judges.builtin:json_schema_judge"
"eval_fabric.identity" = "eval_fabric.judges.builtin:identity_judge"
"eval_fabric.human" = "eval_fabric.judges.builtin:human_judge_factory"

[project.entry-points."eval_fabric.tracestore.backends"]
sqlite = "eval_fabric.tracestore.sqlite:SQLiteTraceStore"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_fabric"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/SECURITY.md",
    "/CONTRIBUTING.md",
    "/ROADMAP.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913",  # too many arguments
    "PLR2004",  # magic numbers
    "PLR0911",  # too many returns
    "PLR0912",  # too many branches
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "B011"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that hit real network or take more than a second",
    "flaky_under_investigation: temporarily skipped while a flake is being diagnosed",
]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
]

[tool.coverage.run]
branch = true
source = ["eval_fabric"]
